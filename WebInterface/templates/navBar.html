<div class="navbar">
    <div class="logo">
        <img draggable="false" src="{{url_for('static', filename='SkySpindleLogo.svg')}}">
    </div>
    <div class="title">
        <h1>
            SkySpindle
        </h1>
    </div>
    
    <button id="ESTOP" onclick="window.socket.emit('ESTOP')">
        <h3 style="color: red;">Emergency Restart</h3>
    </button>
    <div class="dropdown">
        <button class="dropbtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-bell" viewBox="0 0 16 16">
                <path
                    d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z" />
            </svg>
        </button>
        <div class="dropdown-content">
        {% if notifications != None %}
          <div class="notification">
            <p>Update Available to {{notifications['version']}}</p>
            <button>View Changelog</button>
            <button onclick="window.socket.emit('UPDATETOLATEST')">Update</button>
          </div>
        {% endif %}
        </div>
    </div>
    <svg id="ConnectionIndicater" xmlns="http://www.w3.org/2000/svg" style="margin-top: auto; margin-bottom: auto;"
        width="4vh" height="4vh" fill="currentColor" class="bi bi-pc" viewBox="0 0 16 16">
        <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" />
        <title>Disconnected</title>
    </svg>

    <button id="OpenMachineSettings">
        <svg xmlns="http://www.w3.org/2000/svg" width="70%" height="70%" fill="currentColor" class="bi bi-sliders2"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M10.5 1a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V4H1.5a.5.5 0 0 1 0-1H10V1.5a.5.5 0 0 1 .5-.5ZM12 3.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5Zm-6.5 2A.5.5 0 0 1 6 6v1.5h8.5a.5.5 0 0 1 0 1H6V10a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5ZM1 8a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 1 8Zm9.5 2a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V13H1.5a.5.5 0 0 1 0-1H10v-1.5a.5.5 0 0 1 .5-.5Zm1.5 2.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5Z" />
        </svg>
    </button>
</div>
<link rel="stylesheet" href="{{url_for('static', filename='/css/elements/navBar.css')}}">
