<div class="element">
    <div class="elementTitle">
        <span>
            <h3>Machine</h3>
        </span>
    </div>
    <div class="elementContent machine">
        <div class="machineSection">
            <div class="machineOption">
                <p>Acceleration X (mm/s&sup2):</p><input type="number" value="1">
            </div>
            <div class="machineOption">
                <p>Acceleration Y (mm/s&sup2):</p><input type="number" value="1">
            </div>
            <div class="machineOption">
                <p>Acceleration Z (mm/s&sup2):</p><input type="number" value="1">
            </div>
        </div>
        <hr>
        <div class="machineSection">
            <div class="machineOption">
                <p>Max Rate X (mm/s):</p><input type="number" value="1">
            </div>
            <div class="machineOption">
                <p>Max Rate Y (mm/s):</p><input type="number" value="1">
            </div>
            <div class="machineOption">
                <p>Max Rate Z (mm/s):</p><input type="number" value="1">
            </div>
        </div>
        <hr>
        <div class="machineSection" style="grid-template-columns: 50% 50%;">
            <div class="machineOption">
                <p>Feedrate (mm/s):</p><input type="number" value="100">
            </div>
            <div class="machineOption">
                <p>Spindle (rpm):</p><input type="number" value="12000">
            </div>
        </div>
    </div>

</div>
