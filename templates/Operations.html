<div class="element">
    <div class="elementTitle">
        <span>
            <h3>Job Status</h3>
        </span>
    </div>
    <div class="elementContent">
        <h2 class="subtitlemargin">Filename...</h2>
        <hr>
        <div class="status">
            <div class="flex maxwidth">
                <div class="progressBar">
                    <svg width="100" height="100" viewBox="-25 -25 250 250" version="1.1" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(-90deg)">
                        <circle r="90" cx="100" cy="100" fill="transparent" stroke="#e0e0e0" stroke-width="16px" stroke-dasharray="565.48px" stroke-dashoffset="0"></circle>
                        <circle id="StatusCircle" r="90" cx="100" cy="100" stroke="#76e5b1" stroke-width="16px" stroke-linecap="round" stroke-dashoffset="283px" fill="transparent" stroke-dasharray="565.48px"></circle>
                        <text id="StatusText" x="51px" y="118px" fill="#6bdba7" font-size="52px" font-weight="bold" style="transform:rotate(90deg) translate(0px, -196px)">50%</text>
                    </svg>
                </div>
                <div class="OperationInfo">
                    <p>
                        ETA: 10:00 <br>
                        Line Number: 100/10000 <br>
                        Time: 1:00 <br>
                    </p>
                </div>
                <div class="LiveOperationControls">
                    <button class="Btn" title="Cancel/Unload Operation">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="red" class="bi bi-stop-fill" viewBox="0 0 16 16">
                            <path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5z"/>
                        </svg>
                    </button>
                    <button class="Btn" title="Hold (Doesn't stop spindle)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="darkorange" class="bi bi-pause-btn-fill" viewBox="0 0 16 16">
                            <path d="M0 12V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm6.25-7C5.56 5 5 5.56 5 6.25v3.5a1.25 1.25 0 1 0 2.5 0v-3.5C7.5 5.56 6.94 5 6.25 5zm3.5 0c-.69 0-1.25.56-1.25 1.25v3.5a1.25 1.25 0 1 0 2.5 0v-3.5C11 5.56 10.44 5 9.75 5z"/>
                        </svg>
                    </button>
                    <button class="Btn" title="Pause Operation">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="orange" class="bi bi-pause" viewBox="0 0 16 16">
                            <path d="M6 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5zm4 0a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5z"/>
                        </svg>
                    </button>
                    <button class="Btn" title="Start Operation">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="green" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
                            <path d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>



<div class="element">
    <div class="elementTitle">
        <span>
            <h3>Operations</h3>
        </span>
        <button id="uploadButton">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-upload" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
            </svg>
        </button>
        <input name="file" id="fileInput" type="file" accept=".gcode, .nc, .gco, .cnc, .tap" style="display: none;">
    </div>
    <div class="elementContent">
        <h2 class="subtitlemargin">Saved cycles:</h2>
        <hr>
        <div id="operations" class="list">
        </div>
    </div>
</div>
<script src="{{url_for('static', filename='js/elements/Operations.js')}}"></script>
