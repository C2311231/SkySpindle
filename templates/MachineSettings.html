<div class="element floatingMenu" id="MachineSettings">
    <div class="elementTitle">
        <span>
            <h3>Machine Settings</h3>
        </span>
        <button class="closeBtn" id="CloseMachineSettings"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
          </svg></button>
    </div>
    <div class="elementContent">
        <div class="settingsTable">
            <table>
                <thead>
                    <tr>
                        <th>Setting</th>
                        <th>Units</th>
                        <th></th>
                        <th>Value</th>
                        <th>Setting Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5"><hr style="width: 100%;"></td></tr>
                    {% for item in SettingsData %}
                    <tr>
                        <td>{{ item[' Setting'] }}</td>
                        <td>{{ item[' Units'] }}</td>
                        <td><label class="SettingLabel">${{ item['$-Code'] }}:</label></td>
                        <td><input type="number"  data-Send="${{ item['$-Code'] }}" class="machineSetting" id="{{ item['$-Code'] }}"></td>
                        <td><p>{{ item[' Setting Description'] }}</p></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            
        </div>
    </div>
</div>
