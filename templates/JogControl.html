<div class="element">
    <div class="elementTitle">
        <span>
            <h3>Jog Control</h3>
        </span>
    </div>
    <div class="elementContent">
        <div class="position">
            <div class="ABSPOS">
                <h6 id="MXpos">X |0|</h6>
            </div>
            <div class="ABSPOS">
                <h6 id="MYpos">Y |0|</h6>            
            </div>
            <div class="ABSPOS">
                <h6 id="MZpos">Z |0|</h6>            
            </div>
        </div>
        <div class="position">
            <div class="PosInput X">
                <label>X</label>
                <input step="0.01" type="number" value="0.00" id="Xpos">
            </div>
            <div class="PosInput Y">
                <label>Y</label>
                <input step="0.01" type="number" value="0.00" id="Ypos">
            </div>
            <div class="PosInput Z">
                <label>Z</label>
                <input step="0.01" type="number" value="0.00" id="Zpos">
            </div>
        </div>
        <hr>
        <div class="controlSection">
            <div class="JogControl">
                <button class="JogBtn JogBtnL">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-arrow-left"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z" />
                    </svg>
                </button>
                <button class="JogBtn JogBtnR">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white"
                        class="bi bi-arrow-right" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z" />
                    </svg>
                </button>
                <button class="JogBtn JogBtnU">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-arrow-up"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z" />
                    </svg>
                </button>
                <button class="JogBtn JogBtnD">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-arrow-down"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1z" />
                    </svg>
                </button>
                <button class="JogBtn JogBtnUp">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-arrow-up"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z" />
                    </svg>
                </button>
                <button class="JogBtn JogBtnDown">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" class="bi bi-arrow-down"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1z" />
                    </svg>
                </button>
            </div>
            <div class="homing">
                <div class="homingmulti">
                    <button class="homeBtn hAll" id="HomeAll"><b>Home All</b></button>
                    <button class="homeBtn hXY" id="HomeXY"><b>Home XY</b></button>
                </div>

                <div class="homingsingle">
                    <button class="homeBtn homeXBtn" id="HomeX"><b>X</b></button>
                    <button class="homeBtn homeYBtn" id="HomeY"><b>Y</b></button>
                    <button class="homeBtn homeZBtn" id="HomeZ"><b>Z</b></button>
                </div>
            </div>
            <div class="spindleToggle">
                <button class="homeBtn" id="SpindleOn"><b>Spindle On</b></button>
                <button class="homeBtn" id="SpindleOff"><b>Spindle Off</b></button>
            </div>
        </div>
        <hr>
        <div class="JogSlider">
            <span>Distance (mm): <input step="0.01" type="number" value="0.00" class="JogSliderLabel" id="JogDisLabel"></span>
            <div class="slidecontainer">
                <input type="range" min="1" max="50" value="19" step="1" class="slider" id="Jogdistance">
            </div>
        </div>

        <div class="JogSlider">
            <span>Feed (%): <input step="1" type="number" value="100" class="JogSliderLabel" id="JogFeedLabel"></span>
            <div class="slidecontainer">
                <input type="range" min="1" max="200" value="100" step="1" class="slider" id="JogFeed">
            </div>
        </div>

        <div class="JogSlider">
            <span>Spindle (%): <input step="1" type="number" value="100" class="JogSliderLabel" id="JogSpindleLabel"></span>
            <div class="slidecontainer">
                <input type="range" min="1" max="200" value="100" step="1" class="slider" id="JogSpindle">
            </div>
        </div>
        <div class="JogSlider">
            <span>Rapid (%): <input step="1" type="number" value="100" step="25" class="JogSliderLabel" id="JogRapidLabel"></span>
            <div class="slidecontainer">
                <input type="range" min="1" max="3" value="3" step="1" class="slider" id="JogRapid">
            </div>
        </div>

    </div>
</div>
