<div class="element">
    <div class="elementTitle">
        <span>
            <h3>Console</h3>
        </span>
    </div>
    <div class="elementContent console">
        <div class="commandInput">
            <input class="inputcommand" type="text" placeholder="Input command" id="consoleinput">
            <button type="submit" class="SubmitBtn" id="consolesend">Send</button>
        </div>
        <div class="spaceEven">
            <div class="marginAuto MaxConsoleDiv">
                <label>Max items:</label><input id="MaxConsole" type="number" value="500"><button id="ClearConsole">Clear</button>
            </div>
            <div class="marginAuto">
                <label>System</label><input type="checkbox" id="ShowSystemConsole">
            </div>
            <div class="marginAuto">
                <label>Status</label><input type="checkbox" id="ShowStatusConsole">
            </div>
            <div class="marginAuto ">
                <label>Recived</label><input type="checkbox" id="ShowRecivedConsole">
            </div>
        </div>
        <hr>
        <div class="Consolelist" id="Consolelist">
        </div>
    </div>
</div>
<script src="{{url_for('static', filename='js/elements/Console.js')}}"></script>
<link rel="stylesheet" href="{{url_for('static', filename='css/elements/Console.css')}}">
