<div class="element">
    <div class="elementTitle">
        <span>
            <h3>Console</h3>
        </span>
    </div>
    <div class="elementContent console">
        <div class="commandInput">
            <input class="inputcommand" type="text" placeholder="Input command">
            <button type="submit" class="SubmitBtn">Send</button>
        </div>
        <br>
        <div class="Consolelist">
            <div class="consoleitem user">
                <h5>User Sent command</h5>
            </div>
            <div class="consoleitem recive">
                <h5>Recived command</h5>
            </div>
            <div class="consoleitem systemsent">
                <h5>System Sent command</h5>
            </div>
        </div>
    </div>
</div>
